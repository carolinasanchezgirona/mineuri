<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">

<body>
<a class="skip-link" href="#app">Saltar al juego</a>
<header class="game-topbar">
  <a class="game-logo" href="../" aria-label="Volver a Mente en juego"><span>CONSULTA</span><strong>404</strong></a>
  <div class="top-copy"><span>INSTITUTO MINEURI</span><small>de Problemas Perfectamente Normales</small></div>
  <nav class="top-actions" aria-label="Opciones del juego">
    <button type="button" data-open="map">Mapa</button>
    <button type="button" data-open="inventory">Inventario</button>
    <button type="button" data-open="achievements">Logros</button>
    <button type="button" id="help-button">Pista</button>
  </nav>
</header>

<main id="app" tabindex="-1"></main>

<div id="toast" role="status" aria-live="polite"></div>

<dialog id="panel-dialog" aria-labelledby="panel-title">
  <div class="dialog-head"><h2 id="panel-title"></h2><button type="button" class="round" data-close="panel-dialog" aria-label="Cerrar">×</button></div>
  <div id="panel-content"></div>
</dialog>

<dialog id="reset-dialog" aria-labelledby="reset-title">
  <div class="dialog-head"><h2 id="reset-title">¿Empezar de nuevo?</h2><button type="button" class="round" data-close="reset-dialog" aria-label="Cerrar">×</button></div>
  <p>Se borrará el progreso de este episodio guardado en este dispositivo.</p>
  <div class="dialog-actions"><button type="button" class="btn ghost" data-close="reset-dialog">Seguir jugando</button><button type="button" class="btn primary" id="confirm-reset">Empezar de nuevo</button></div>
</dialog>

<footer class="game-footer">
  <a href="../">← Mente en juego</a>
  <span>Temporada 1 · Episodio 1: El despacho que no existía</span>
  <button type="button" id="reset-button">Reiniciar</button>
